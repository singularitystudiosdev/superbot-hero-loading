<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Activity panel variants</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: #050505; color: #FAF9F5; font: 13px/1.3 "SF Pro Text", "Inter", system-ui, sans-serif; }
  .bar { display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-bottom: 1px solid rgba(255, 255, 255, .1); background: #0c0c0d; flex-wrap: wrap; }
  .bar h1 { margin: 0 10px 0 0; font-size: 13px; font-weight: 600; }
  .v { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border: 1px solid rgba(255, 255, 255, .12); border-radius: 8px; background: transparent; color: #C2C0B6; font: inherit; cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
  .v:hover { background: rgba(255, 255, 255, .06); color: #FAF9F5; }
  .v:focus-visible, .ctl:focus-visible { outline: 2px solid #8fb3ff; outline-offset: 2px; }
  .v[aria-pressed="true"] { background: #FAF9F5; color: #0c0c0d; border-color: #FAF9F5; }
  .v b { font-variant-numeric: tabular-nums; opacity: .6; font-weight: 600; }
  .sp { flex: 1; }
  #list { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .fam { margin: 0 2px 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #6f6d68; }
  .ctl { height: 30px; padding: 0 12px; border: 0; border-radius: 8px; background: #1d1d20; color: #FAF9F5; font: inherit; cursor: pointer; }
  .ctl:hover { background: #2a2a2e; }
  .hint { color: #6f6d68; font-size: 12px; margin-left: 6px; }
  iframe { flex: 1; width: 100%; border: 0; background: #000; }
</style>
</head>
<body>
<div class="bar" role="toolbar" aria-label="Variants">
  <h1>Activity panel</h1>
  <span id="list"></span>
  <span class="sp"></span>
  <button class="ctl" id="prev" type="button" aria-label="Previous variant">←</button>
  <button class="ctl" id="next" type="button" aria-label="Next variant">→</button>
  <button class="ctl" id="replay" type="button">Replay</button>
  <span class="hint">← → to switch, R to replay</span>
</div>
<iframe id="stage" title="superbot hero with Activity panel"></iframe>
<script>
  const LIST = [
    ["s1", "Inline trail"], ["s2", "Reasoned cards"], ["s3", "Tool chips"], ["s4", "Collapsing steps"], ["s5", "Chat turns"],
    ["s6", "Pinned thought + ticker"], ["s7", "Skeleton fill"], ["s8", "Call blocks"], ["s9", "Nested results"], ["s10", "Scrim status"],
    ["t1", "Stream + tool nodes"], ["t2", "Tools inside entries"], ["t3", "Wide thumbs"], ["t4", "Tool strip"], ["t5", "Compact"],
  ];
  const list = document.getElementById("list");
  const stage = document.getElementById("stage");
  // t skips most of the intro so the demo reaches the ask quickly
  const SKIP = "&t=3600";
  const start = LIST.findIndex(([id]) => id === new URLSearchParams(location.search).get("v"));
  let cur = start < 0 ? 0 : start;
  const btns = LIST.map(([id, n], i) => {
    if (i === 0 || id[0] !== LIST[i - 1][0][0]) list.append(Object.assign(document.createElement("span"), { className: "fam", textContent: id[0] === "s" ? "Stack" : "Timeline" }));
    const b = document.createElement("button");
    b.className = "v"; b.type = "button";
    b.innerHTML = `<b>${id.toUpperCase()}</b>${n}`;
    b.addEventListener("click", () => show(i));
    list.append(b);
    return b;
  });
  function show(i) {
    cur = (i + LIST.length) % LIST.length;
    btns.forEach((b, k) => b.setAttribute("aria-pressed", String(k === cur)));
    stage.src = `activity.a2941ab4.html?v=${LIST[cur][0]}${SKIP}&r=${Date.now()}`;
    history.replaceState(null, "", `?v=${LIST[cur][0]}`);
  }
  document.getElementById("prev").onclick = () => show(cur - 1);
  document.getElementById("next").onclick = () => show(cur + 1);
  document.getElementById("replay").onclick = () => show(cur);
  addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") show(cur + 1);
    else if (e.key === "ArrowLeft") show(cur - 1);
    else if (e.key === "r") show(cur);
  });
  show(cur);
</script>
</body>
</html>
