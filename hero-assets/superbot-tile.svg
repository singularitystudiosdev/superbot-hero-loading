<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<!-- superbot app icon, taken from xdxdxd.dsh.sh (2026-09-12): the selected rail
     tile of the duostorm kit: the storm aura as the ground (site.css storm-1
     to storm-4: blue, purple, magenta, pink, with a teal storm-0 orb in the
     top-left corner), the storm ring (tile.svg's 14-unit stroke on the 512
     grid), and the duotone cat mark (mark.svg geometry: white face, teal and
     magenta ghosts 1.2 units off). Nothing here is hue-rotated: every colour
     is one of the five storm stops. -->
<defs>
  <linearGradient id="storm" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00e5c3"/>
    <stop offset=".25" stop-color="#2b6bff"/>
    <stop offset=".5" stop-color="#6a1fd8"/>
    <stop offset=".75" stop-color="#c026d3"/>
    <stop offset="1" stop-color="#ff3d9a"/>
  </linearGradient>
  <linearGradient id="aura" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2b6bff"/>
    <stop offset=".48" stop-color="#6a1fd8"/>
    <stop offset=".76" stop-color="#c026d3"/>
    <stop offset="1" stop-color="#ff3d9a"/>
  </linearGradient>
  <radialGradient id="orb-a" cx=".14" cy=".1" r=".55">
    <stop offset="0" stop-color="#00e5c3" stop-opacity=".55"/>
    <stop offset="1" stop-color="#00e5c3" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="orb-b" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#8b5cf6" stop-opacity=".5"/>
    <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="tile"><rect width="512" height="512" rx="115"/></clipPath>
  <mask id="face" maskUnits="userSpaceOnUse" x="-30" y="-30" width="160" height="160">
    <g fill="#fff">
      <rect x="14" y="32" width="72" height="54" rx="15"/>
      <path d="M14 46V28Q14 20 21 21Q28 24 36 32Z"/>
      <path d="M86 46V28Q86 20 79 21Q72 24 64 32Z"/>
    </g>
    <g fill="#000">
      <ellipse cx="35" cy="58" rx="8" ry="11"/>
      <ellipse cx="65" cy="58" rx="8" ry="11"/>
    </g>
  </mask>
</defs>
<g clip-path="url(#tile)">
  <rect width="512" height="512" fill="url(#aura)"/>
  <rect width="512" height="512" fill="url(#orb-a)"/>
  <rect width="512" height="512" fill="url(#orb-b)"/>
</g>
<rect x="7" y="7" width="498" height="498" rx="108" fill="none" stroke="url(#storm)" stroke-width="14"/>
<g transform="scale(5.12)">
  <rect x="-30" y="-30" width="160" height="160" fill="#00e5c3" mask="url(#face)" transform="translate(-1.2 -1.2)"/>
  <rect x="-30" y="-30" width="160" height="160" fill="#c026d3" mask="url(#face)" transform="translate(1.2 1.2)"/>
  <rect x="-30" y="-30" width="160" height="160" fill="#ffffff" mask="url(#face)"/>
</g>
</svg>
